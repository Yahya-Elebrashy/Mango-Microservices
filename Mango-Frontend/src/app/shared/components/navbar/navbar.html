<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
            <i class="bi bi-basket2-fill text-warning"></i>
            <span class="fw-bold">Mango</span>
        </a>

        <!-- Mobile toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
            aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">

            <!-- Left links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" routerLink="/" routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }">
                        Home
                    </a>
                </li>

                <!-- Admin only -->
                <ng-container *ngIf="authState.isAdmin">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/product" routerLinkActive="active">
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" routerLink="/coupon" routerLinkActive="active">
                            Coupons
                        </a>
                    </li>
                </ng-container>

                <!-- Logged-in users -->
                <ng-container *ngIf="authState.isLoggedIn">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/order" routerLinkActive="active">
                            Orders
                        </a>
                    </li>
                </ng-container>

            </ul>

            <!-- Right links -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">

                <!-- Cart badge — logged-in only -->
                <li class="nav-item me-2" *ngIf="authState.isLoggedIn">
                    <a class="nav-link position-relative" routerLink="/cart">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span *ngIf="cartService.cartCount() > 0" class="position-absolute top-0 start-100 translate-middle
                     badge rounded-pill bg-warning text-dark" style="font-size: 0.65rem;">
                            {{ cartService.cartCount() }}
                        </span>
                    </a>
                </li>

                <!-- Guest -->
                <ng-container *ngIf="!authState.isLoggedIn">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/auth/register">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-warning btn-sm ms-2" routerLink="/auth/login">
                            Login
                        </a>
                    </li>
                </ng-container>

                <!-- Logged in -->
                <ng-container *ngIf="authState.isLoggedIn">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-1" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i>
                            {{ authState.currentUser?.name }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <span class="dropdown-item-text text-muted small">
                                    {{ authState.currentRole }}
                                </span>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <button class="dropdown-item text-danger" (click)="logout()">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </li>
                        </ul>
                    </li>
                </ng-container>

            </ul>
        </div>
    </div>
</nav>
