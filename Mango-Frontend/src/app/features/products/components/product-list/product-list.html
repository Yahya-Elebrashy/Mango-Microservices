<div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">Products</h3>
            <p class="text-muted small mb-0">{{ products().length }} total</p>
        </div>
        <a routerLink="/product/create" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> New product
        </a>
    </div>

    <app-alert [message]="errorMsg()" type="danger" />
    <app-spinner [visible]="loading()" />

    <!-- Table -->
    <div *ngIf="!loading() && products().length > 0" class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width:60px"></th>
                        <th>Name</th>
                        <th>Category</th>
                        <th class="text-end">Price</th>
                        <th class="text-center" style="width:160px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let p of products()">

                        <!-- Thumbnail -->
                        <td>
                            <img [src]="p.imageUrl || 'assets/images/placeholder.png'" [alt]="p.name" class="rounded"
                                style="width:44px;height:44px;object-fit:cover;" />
                        </td>

                        <td class="fw-semibold">{{ p.name }}</td>

                        <td>
                            <span class="badge bg-warning text-dark">
                                {{ p.categoryName }}
                            </span>
                        </td>

                        <td class="text-end fw-bold">
                            ${{ p.price | number:'1.2-2' }}
                        </td>

                        <!-- Actions -->
                        <td class="text-center">
                            <a [routerLink]="['/product/edit', p.productId]"
                                class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a [routerLink]="['/product/delete', p.productId]" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading() && products().length === 0 && !errorMsg()" class="text-center py-5">
        <i class="bi bi-box-seam text-muted" style="font-size:3rem;"></i>
        <p class="text-muted mt-3">No products yet.</p>
        <a routerLink="/product/create" class="btn btn-primary btn-sm">
            Add your first product
        </a>
    </div>

</div>
