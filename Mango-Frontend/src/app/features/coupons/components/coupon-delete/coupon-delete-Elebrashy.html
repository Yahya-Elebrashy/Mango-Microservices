<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <!-- Header -->
      <div class="d-flex align-items-center gap-3 mb-4">
        <a routerLink="/coupon" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="fw-bold mb-0">Delete coupon</h4>
      </div>

      <app-spinner [visible]="loading()" />

      <div *ngIf="!loading() && coupon()" class="card border-0 shadow-sm">
        <div class="card-body p-4 text-center">

          <!-- Icon -->
          <div class="mb-3">
            <i class="bi bi-ticket-perforated text-warning" style="font-size:4rem;"></i>
          </div>

          <!-- Coupon details -->
          <h4 class="fw-bold font-monospace mb-1">
            {{ coupon()!.couponCode }}
          </h4>

          <div class="d-flex justify-content-center gap-4 mt-3 mb-4">
            <div class="text-center">
              <p class="text-muted small mb-0">Discount</p>
              <p class="fw-bold text-success mb-0">
                ${{ coupon()!.discountAmount | number:'1.2-2' }}
              </p>
            </div>
            <div class="vr"></div>
            <div class="text-center">
              <p class="text-muted small mb-0">Min. order</p>
              <p class="fw-bold mb-0">
                ${{ coupon()!.minAmount | number:'1.2-2' }}
              </p>
            </div>
          </div>

          <!-- Warning -->
          <div class="alert alert-danger text-start mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            This coupon will be <strong>permanently deleted</strong>.
            Any users with this code will no longer be able to apply it.
          </div>

          <!-- Actions -->
          <div class="d-flex gap-2 justify-content-center">
            <button
              class="btn btn-danger px-4"
              (click)="confirmDelete()"
              [disabled]="deleting()"
            >
              <span
                *ngIf="deleting()"
                class="spinner-border spinner-border-sm me-2"
                role="status"
              ></span>
              {{ deleting() ? 'Deleting...' : 'Yes, delete it' }}
            </button>
            <a routerLink="/coupon" class="btn btn-outline-secondary px-4">
              Cancel
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
