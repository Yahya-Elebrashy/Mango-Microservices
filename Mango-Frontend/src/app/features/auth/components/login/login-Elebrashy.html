<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <i class="bi bi-basket2-fill text-warning fs-1"></i>
                        <h4 class="fw-bold mt-2">Welcome back</h4>
                        <p class="text-muted small">Sign in to your Mango account</p>
                    </div>

                    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="userName">
                                Email address
                            </label>
                            <input id="userName" type="email" class="form-control"
                                [class.is-invalid]="f['userName'].invalid && f['userName'].touched"
                                formControlName="userName" placeholder="you@example.com" autocomplete="email" />
                            <div class="invalid-feedback">
                                <span *ngIf="f['userName'].errors?.['required']">Email is required.</span>
                                <span *ngIf="f['userName'].errors?.['email']">Enter a valid email.</span>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="password">
                                Password
                            </label>
                            <div class="input-group">
                                <input id="password" [type]="showPassword ? 'text' : 'password'" class="form-control"
                                    [class.is-invalid]="f['password'].invalid && f['password'].touched"
                                    formControlName="password" placeholder="••••••••" autocomplete="current-password" />
                                <button class="btn btn-outline-secondary" type="button" (click)="togglePassword()">
                                    <i class="bi" [class.bi-eye]="!showPassword"
                                        [class.bi-eye-slash]="showPassword"></i>
                                </button>
                                <div class="invalid-feedback">
                                    <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
                                    <span *ngIf="f['password'].errors?.['minlength']">Minimum 6 characters.</span>
                                </div>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary" [disabled]="loading">
                                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status">
                                </span>
                                {{ loading ? 'Signing in...' : 'Sign in' }}
                            </button>
                        </div>

                    </form>

                    <!-- Footer -->
                    <hr class="my-4">
                    <p class="text-center text-muted small mb-0">
                        Don't have an account?
                        <a routerLink="/auth/register" class="text-warning fw-semibold">
                            Register here
                        </a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>
