<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="d-flex align-items-center gap-3 mb-4">
        <a routerLink="/product" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="fw-bold mb-0">Edit product</h4>
      </div>

      <app-spinner [visible]="loading()" />

      <div *ngIf="!loading()" class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

            <div class="mb-3">
              <label class="form-label fw-semibold">Name</label>
              <input type="text" class="form-control" [class.is-invalid]="f['name'].invalid && f['name'].touched"
                formControlName="name" />
              <div class="invalid-feedback">
                <span *ngIf="f['name'].errors?.['required']">Name is required.</span>
                <span *ngIf="f['name'].errors?.['minlength']">Minimum 2 characters.</span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Price ($)</label>
              <input type="number" class="form-control" [class.is-invalid]="f['price'].invalid && f['price'].touched"
                formControlName="price" step="0.01" min="0.01" />
              <div class="invalid-feedback">
                <span *ngIf="f['price'].errors?.['required']">Price is required.</span>
                <span *ngIf="f['price'].errors?.['min']">Must be greater than 0.</span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Category</label>
              <input type="text" class="form-control"
                [class.is-invalid]="f['categoryName'].invalid && f['categoryName'].touched"
                formControlName="categoryName" />
              <div class="invalid-feedback">Category is required.</div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea class="form-control" rows="3"
                [class.is-invalid]="f['description'].invalid && f['description'].touched" formControlName="description">
              </textarea>
              <div class="invalid-feedback">
                <span *ngIf="f['description'].errors?.['required']">Description is required.</span>
                <span *ngIf="f['description'].errors?.['minlength']">Minimum 10 characters.</span>
              </div>
            </div>

            <!-- Image -->
            <div class="mb-4">
              <label class="form-label fw-semibold">
                Product image
                <span class="text-muted fw-normal small">(JPG or PNG, max 1MB)</span>
              </label>
              <div *ngIf="imagePreview()" class="mb-2 rounded overflow-hidden" style="height:160px;background:#f8f9fa;">
                <img [src]="imagePreview()" alt="Preview" class="w-100 h-100" style="object-fit:contain;" />
              </div>
              <input type="file" class="form-control" [class.is-invalid]="!!imageError()" accept=".jpg,.jpeg,.png"
                (change)="onFileChange($event)" />
              <div class="text-danger small mt-1" *ngIf="imageError()">
                {{ imageError() }}
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="saving()">
                <span *ngIf="saving()" class="spinner-border spinner-border-sm me-2" role="status"></span>
                {{ saving() ? 'Saving...' : 'Save changes' }}
              </button>
              <a routerLink="/product" class="btn btn-outline-secondary">
                Cancel
              </a>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
