<div class="container">
    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-md-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill text-warning fs-1"></i>
                        <h4 class="fw-bold mt-2">Create an account</h4>
                        <p class="text-muted small">Join Mango and start ordering</p>
                    </div>

                    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="name">Full name</label>
                            <input id="name" type="text" class="form-control"
                                [class.is-invalid]="f['name'].invalid && f['name'].touched" formControlName="name"
                                placeholder="John Doe" />
                            <div class="invalid-feedback">
                                <span *ngIf="f['name'].errors?.['required']">Name is required.</span>
                                <span *ngIf="f['name'].errors?.['minlength']">Minimum 2 characters.</span>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="email">Email address</label>
                            <input id="email" type="email" class="form-control"
                                [class.is-invalid]="f['email'].invalid && f['email'].touched" formControlName="email"
                                placeholder="you@example.com" autocomplete="email" />
                            <div class="invalid-feedback">
                                <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
                                <span *ngIf="f['email'].errors?.['email']">Enter a valid email.</span>
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="phoneNumber">Phone number</label>
                            <input id="phoneNumber" type="tel" class="form-control"
                                [class.is-invalid]="f['phoneNumber'].invalid && f['phoneNumber'].touched"
                                formControlName="phoneNumber" placeholder="+1234567890" />
                            <div class="invalid-feedback">
                                <span *ngIf="f['phoneNumber'].errors?.['required']">Phone is required.</span>
                                <span *ngIf="f['phoneNumber'].errors?.['pattern']">Enter a valid phone number.</span>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="password">Password</label>
                            <div class="input-group">
                                <input id="password" [type]="showPassword ? 'text' : 'password'" class="form-control"
                                    [class.is-invalid]="f['password'].invalid && f['password'].touched"
                                    formControlName="password" placeholder="••••••••" autocomplete="new-password" />
                                <button class="btn btn-outline-secondary" type="button" (click)="togglePassword()">
                                    <i class="bi" [class.bi-eye]="!showPassword"
                                        [class.bi-eye-slash]="showPassword"></i>
                                </button>
                                <div class="invalid-feedback">
                                    <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
                                    <span *ngIf="f['password'].errors?.['minlength']">Minimum 6 characters.</span>
                                </div>
                            </div>
                        </div>

                        <!-- Role -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="role">Role</label>
                            <select id="role" class="form-select" formControlName="role">
                                <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
                            </select>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary" [disabled]="loading">
                                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status">
                                </span>
                                {{ loading ? 'Creating account...' : 'Create account' }}
                            </button>
                        </div>

                    </form>

                    <!-- Footer -->
                    <hr class="my-4">
                    <p class="text-center text-muted small mb-0">
                        Already have an account?
                        <a routerLink="/auth/login" class="text-warning fw-semibold">
                            Sign in
                        </a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>
