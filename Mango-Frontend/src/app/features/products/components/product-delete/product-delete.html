<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="d-flex align-items-center gap-3 mb-4">
        <a routerLink="/product" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="fw-bold mb-0">Delete product</h4>
      </div>

      <app-spinner [visible]="loading()" />

      <div *ngIf="!loading() && product()" class="card border-0 shadow-sm">
        <div class="card-body p-4 text-center">

          <!-- Image -->
          <div
            class="mx-auto mb-3 rounded overflow-hidden"
            style="width:120px;height:120px;background:#f8f9fa;"
          >
            <img
              [src]="product()!.imageUrl || 'assets/images/placeholder.png'"
              [alt]="product()!.name"
              class="w-100 h-100"
              style="object-fit:cover;"
            />
          </div>

          <h5 class="fw-bold">{{ product()!.name }}</h5>
          <p class="text-muted small mb-1">{{ product()!.categoryName }}</p>
          <p class="fw-bold text-primary mb-4">
            ${{ product()!.price | number:'1.2-2' }}
          </p>

          <!-- Warning -->
          <div class="alert alert-danger text-start">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            This action is <strong>permanent</strong> and cannot be undone.
          </div>

          <!-- Actions -->
          <div class="d-flex gap-2 justify-content-center mt-3">
            <button
              class="btn btn-danger px-4"
              (click)="confirmDelete()"
              [disabled]="deleting()"
            >
              <span
                *ngIf="deleting()"
                class="spinner-border spinner-border-sm me-2"
                role="status"
              ></span>
              {{ deleting() ? 'Deleting...' : 'Yes, delete it' }}
            </button>
            <a routerLink="/product" class="btn btn-outline-secondary px-4">
              Cancel
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
